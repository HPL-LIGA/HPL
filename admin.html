
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HPL | Administrace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #07111f; color: #eef4ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 480px; padding: 30px;
      background: #101e31; border: 1px solid #263b56;
      border-radius: 18px;
    }
    .brand { color: #58a6ff; font-weight: 800; letter-spacing: 3px; }
    h1 { margin-bottom: 8px; }
    p { color: #aabbd0; line-height: 1.5; }
    button {
      width: 100%; margin-top: 18px; padding: 14px;
      border: 0; border-radius: 8px; cursor: pointer;
      background: #3287f6; color: white; font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 18px; overflow-wrap: anywhere; }
    .hidden { display: none; }
    .panel { margin-top: 24px; padding-top: 20px; border-top: 1px solid #344c69; }
    .secondary { background: #263b56; }
  </style>
</head>
<body>
  <main>
    <div class="brand">HPL · ADMIN</div>
    <h1>Administrace ligy</h1>
    <p>Přihlas se přes GitHub. Přístup do administrace získají pouze účty schválené jako administrátoři HPL.</p>

    <button id="loginButton" type="button">Přihlásit se přes GitHub</button>
    <p id="message" role="status">Kontroluji přihlášení…</p>

    <section id="adminPanel" class="panel hidden">
      <h2>Přístup povolen</h2>
      <p id="accountInfo"></p>
      <p>Ověření administrátora funguje. V další fázi sem přidáme správu zápasů a výsledků.</p>
      <button id="logoutButton" class="secondary" type="button">Odhlásit se</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://hmwbrebwjcgtxtbcebec.supabase.co";

    // Vlož stejný veřejný sb_publishable_ klíč jako na hlavním webu.
    const SUPABASE_KEY = "sb_publishable_j3-UIjNpqdxWSoNaPsFdzw_O0pFpsYH";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const panel = document.getElementById("adminPanel");

    async function checkAdmin(session) {
      panel.classList.add("hidden");
      loginButton.classList.remove("hidden");

      if (!session) {
        message.textContent = "Pro pokračování se přihlas přes GitHub.";
        return;
      }

      message.textContent = "Ověřuji oprávnění administrátora…";

      const { data, error } = await client
        .from("hpl_admins")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (error) {
        message.textContent = "Ověření se nezdařilo. Zkontroluj nastavení Supabase.";
        return;
      }

      if (!data) {
        await client.auth.signOut();
        message.textContent = "Tento GitHub účet nemá oprávnění administrátora HPL.";
        return;
      }

      loginButton.classList.add("hidden");
      panel.classList.remove("hidden");
      document.getElementById("accountInfo").textContent =
        "Přihlášený účet: " + (session.user.email || "GitHub účet");
      message.textContent = "Úspěšně ověřeno.";
    }

    loginButton.addEventListener("click", async () => {
      loginButton.disabled = true;
      message.textContent = "Přesměrovávám na GitHub…";

      const { error } = await client.auth.signInWithOAuth({
        provider: "github",
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });

      if (error) {
        message.textContent = "Přihlášení se nepodařilo zahájit. Zkontroluj nastavení GitHub providera.";
        loginButton.disabled = false;
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await client.auth.signOut();
      panel.classList.add("hidden");
      loginButton.classList.remove("hidden");
      loginButton.disabled = false;
      message.textContent = "Byl/a jsi odhlášen/a.";
    });

    client.auth.onAuthStateChange((_event, session) => {
      checkAdmin(session);
    });

    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        message.textContent = "Nepodařilo se načíst přihlášení.";
        return;
      }
      checkAdmin(data.session);
    });
  </script>
</body>
</html>
