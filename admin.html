
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HPL | Administrace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #07111f; color: #eef4ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; padding: 30px;
      background: #101e31; border: 1px solid #263b56;
      border-radius: 18px;
    }
    .brand { color: #58a6ff; font-weight: 800; letter-spacing: 3px; }
    h1 { margin-bottom: 8px; }
    p { color: #aabbd0; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%; padding: 13px; border-radius: 8px;
      border: 1px solid #344c69; background: #091525;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px;
      border: 0; border-radius: 8px; cursor: pointer;
      background: #3287f6; color: white; font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 18px; overflow-wrap: anywhere; }
    .hidden { display: none; }
    .panel { margin-top: 24px; padding-top: 20px; border-top: 1px solid #344c69; }
  </style>
</head>
<body>
  <main>
    <div class="brand">HPL · ADMIN</div>
    <h1>Administrace ligy</h1>
    <p>Přihlas se svým potvrzeným účtem. Přístup bude povolen pouze účtům evidovaným jako administrátoři HPL.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Heslo</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Přihlásit se</button>
    </form>

    <p id="message" role="status"></p>

    <section id="adminPanel" class="panel hidden">
      <h2>Přístup povolen</h2>
      <p id="accountInfo"></p>
      <p>Ověření administrátora funguje. V další fázi sem přidáme správu zápasů a výsledků.</p>
      <button id="logoutButton" type="button">Odhlásit se</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://hmwbrebwjcgtxtbcebec.supabase.co";

    // Vlož sem svůj veřejný sb_publishable_ klíč používaný na hlavní stránce.
    const SUPABASE_KEY = "sb_publishable_j3-UIjNpqdxWSoNaPsFdzw_O0pFpsYH";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const panel = document.getElementById("adminPanel");
    const button = document.getElementById("loginButton");

    function showMessage(text) {
      message.textContent = text;
    }

    async function checkAdmin(session) {
      panel.classList.add("hidden");
      form.classList.remove("hidden");

      if (!session) {
        showMessage("Přihlas se svým administrátorským účtem.");
        return;
      }

      showMessage("Ověřuji oprávnění…");

      const { data, error } = await client
        .from("hpl_admins")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (error) {
        showMessage("Ověření se nezdařilo. Zkontroluj nastavení Supabase a oprávnění tabulky.");
        return;
      }

      if (!data) {
        await client.auth.signOut();
        showMessage("Tento účet nemá oprávnění administrátora HPL.");
        return;
      }

      form.classList.add("hidden");
      panel.classList.remove("hidden");
      document.getElementById("accountInfo").textContent =
        "Přihlášený účet: " + session.user.email;
      showMessage("Úspěšně ověřeno.");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      showMessage("Přihlašuji…");

      const { data, error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      button.disabled = false;

      if (error) {
        showMessage("Přihlášení se nezdařilo. Zkontroluj e-mail a heslo.");
        return;
      }

      await checkAdmin(data.session);
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await client.auth.signOut();
      panel.classList.add("hidden");
      form.classList.remove("hidden");
      form.reset();
      showMessage("Byl/a jsi odhlášen/a.");
    });

    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        showMessage("Nepodařilo se načíst přihlášení.");
        return;
      }
      checkAdmin(data.session);
    });
  </script>
</body>
</html>
